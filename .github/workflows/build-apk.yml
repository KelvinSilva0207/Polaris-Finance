name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ALIAS" ]; then
              echo "::error::Faltan ANDROID_KEYSTORE_PASSWORD o ANDROID_KEYSTORE_ALIAS"; exit 1
            fi
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_ALIAS=$ANDROID_KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install Android NDK (required by plugins with native code)
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          NDK="$(sed -n 's/.*val ndkVersion: String = "\([^"]*\)".*/\1/p' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$NDK" ]; then echo "::error::No se pudo leer ndkVersion de Flutter"; exit 1; fi
          echo "NDK requerido por Flutter: $NDK"
          if [ -d "$SDK/ndk/$NDK" ]; then echo "NDK ya instalado"; exit 0; fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK"; then break; fi
            echo "Fallo la instalacion del NDK (intento $attempt)"; sleep 15
          done
          test -d "$SDK/ndk/$NDK"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build release APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          mkdir -p build/ota
          if [ -n "$SENTRY_DSN" ]; then
            DART_DEFINE="--dart-define=SENTRY_DSN=$SENTRY_DSN"
          else
            DART_DEFINE=""
          fi

          # 1) APK por arquitectura: el telefono descarga solo ~36 MB en vez
          #    del universal de ~76 MB, que es lo que hace que la descarga
          #    in-app se quede colgada al final.
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} $DART_DEFINE
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-$abi-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "build/ota/polaris-finance-$abi.apk"
            fi
          done

          # 2) APK universal (arm64-v8a + armeabi-v7a) como respaldo para
          #    versiones antiguas de la app, que no saben elegir por ABI.
          flutter build apk --release --build-number=${{ github.run_number }} $DART_DEFINE
          cp build/app/outputs/flutter-apk/app-release.apk build/ota/polaris-finance.apk
          ls -lh build/ota

      - name: Verify APK signing
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for apk in build/ota/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/ota
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then echo "::error::No se pudo leer la version de pubspec.yaml"; exit 1; fi
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Última versión" --notes "APK más reciente generado automáticamente."

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/polaris-finance.apk"
          for apk in build/ota/*.apk; do
            gh release upload latest "$apk" --clobber
          done

          # Manifiesto de versión para la actualización in-app (OTA):
          # el tag del release es literalmente "latest", por lo que la app lee
          # la versión real desde version.json en main.
          # Además se publica un APK por arquitectura para que cada teléfono
          # descargue solo el que le corresponde.
          BUILD_NUMBER="${{ github.run_number }}"
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES="$(gh release view latest --json body -q .body 2>/dev/null || echo '')"
          python3 - "$VERSION" "$BUILD_NUMBER" "$DOWNLOAD_URL" "$PUBLISHED" "$NOTES" > version.json <<'PY'
          import json, os, sys
          version, build, url, published, notes = sys.argv[1:6]
          base = url.rsplit('/', 1)[0]
          downloads = {}
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              if os.path.exists(f"build/ota/polaris-finance-{abi}.apk"):
                  downloads[abi] = f"{base}/polaris-finance-{abi}.apk"
          json.dump({
              "version": version,
              "build": int(build),
              "download_url": url,
              "downloads": downloads,
              "published_at": published,
              "notes": notes,
          }, sys.stdout, indent=2)
          PY
          gh release upload latest version.json --clobber

      - name: Commit version manifest
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f version.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then echo "Sin cambios en version.json"; exit 0; fi
          git commit -m "chore: actualizar manifiesto de version (OTA) [skip ci]"
          git push
