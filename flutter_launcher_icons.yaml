# Genera los iconos de la app desde los derivados transparentes de logo.png.
# - icon_square.png: logo al 92% (icono clásico).
# - icon_foreground.png: logo al 64% dentro de la zona segura adaptativa.
# - adaptive_icon_background usa el azul de marca (#0C3A88).
# Ejecutar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon_square.png"
  android: true
  adaptive_icon_background: "#0C3A88"
  adaptive_icon_foreground: "icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 26
  web:
    generate: true
    image_path: "icon_square.png"
    background_color: "#0C3A88"
    theme_color: "#0C3A88"
  windows:
    generate: true
    image_path: "icon_square.png"
    icon_size: 256
