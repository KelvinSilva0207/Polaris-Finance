# Genera los iconos de la app desde los derivados de assets/logo.png.
# - icon_square.png: logo completo al 100% del lienzo (Android legacy, web y
#   Windows). Sin margen transparente: el sistema aplica las esquinas.
# - icon_foreground.png: solo la brújula/estrella al 61% (zona segura de los
#   iconos adaptativos) sobre fondo transparente.
# - icon_ios.png: navy a sangre con la brújula (iOS no admite canal alfa).
# El fondo adaptativo usa el navy del propio logo (#041027), sin recuadros.
# Ejecutar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon_square.png"
  android: true
  adaptive_icon_background: "#041027"
  adaptive_icon_foreground: "icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: "icon_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  web:
    generate: true
    image_path: "icon_square.png"
    background_color: "#041027"
    theme_color: "#0C3A88"
  windows:
    generate: true
    image_path: "icon_square.png"
    icon_size: 256
